name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.14]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Pinned by SHA (v10.2.0). Keep `version` in sync with pyproject.toml
      # ([tool.uv] required-version) and docker/images/Dockerfile.
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.20"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Run JavaScript tests
        run: npm test
      - name: Setup Docker Deps
        run: make docker-services
      - name: Install dependencies
        run: make packages
      - name: Run tests
        run: make test
      - name: Report test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/test-reports/