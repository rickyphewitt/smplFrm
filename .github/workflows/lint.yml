name: Lint

# Produces the required `lint` status check. Keep the workflow name, the job id
# `lint` (with no job-level `name:`), and these unfiltered triggers so the check
# reports on every PR.
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned by SHA (v10.2.0); same pin and uv version as ci.yml.
      # Python comes from .python-version; Ruff's version comes from uv.lock.
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.20"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Ruff format
        run: uv run --locked ruff format --check .
      - name: Ruff check
        run: uv run --locked ruff check .
