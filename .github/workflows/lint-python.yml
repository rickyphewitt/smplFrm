name: Lint Python

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

# Mirrors the Ruff hooks in .pre-commit-config.yaml (and `make lint`).
# Triggers have no path filters so the `lint-python` check reports on every PR,
# which keeps it usable as a required status check.
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint-python:
    # Runner image pinned to match ci.yml; see the comment there before bumping.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      # Pinned by SHA (v10.2.0); same pin and uv version as ci.yml.
      # Python comes from .python-version; Ruff's version comes from uv.lock.
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.20"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Ruff format
        run: uv run --locked ruff format --check .
      - name: Ruff check
        run: uv run --locked ruff check .
