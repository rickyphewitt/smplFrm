name: Sync Wiki
permissions:
  contents: write
on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'

jobs:
  sync:
    # Runner image pinned to match ci.yml; see the comment there before bumping.
    # This workflow runs only on pushes to main that touch docs/**, so the label
    # is not exercised by pull request checks.
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v5

      - name: Checkout wiki
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Sync docs to wiki
        run: |
          rsync -av --delete --exclude='.git' docs/ wiki/

      - name: Push to wiki
        run: |
          cd wiki
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes to commit"
          else
            git commit -m "docs: sync wiki from docs/ (${{ github.sha }})"
            git push
          fi
