# Python project metadata and dependency declarations, managed by uv.
# The app runs from src/smplfrm and is not built or installed as a package.
# https://docs.astral.sh/uv/concepts/projects/config/
[project]
name = "smplfrm"
# Placeholder required by PEP 621. The released version comes from git tags
# (scripts/generate_version.sh), not from this field.
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "opencv-python~=5.0.0.93",
    "pillow~=12.3.0",
    "python-dateutil~=2.9.0",
    "Django~=6.0.7",
    "djangorestframework~=3.18.1",
    "djangorestframework-jsonapi==8.1.0",
    "celery~=5.6.3",
    "django-celery-beat~=2.9.0",
    "redis~=8.1.0",
    "open-meteo~=0.4.0",
    "django-redis~=7.0.0",
    "spotipy~=2.26.0",
    "whitenoise~=6.12.0",
    "gunicorn~=26.2.0",
]

# Development-only tools; excluded from the Docker image (`uv sync --no-dev`).
[dependency-groups]
dev = [
    "pytest-django~=4.14.0",
    "pre-commit~=4.6.2",
]

[tool.uv]
package = false
# Minimum uv version. Keep in sync with the exact pins in
# .github/workflows/ci.yml (setup-uv `version`) and docker/images/Dockerfile.
# A minimum (not exact) pin lets developers and Dependabot run newer uv releases.
required-version = ">=0.12.20"

# Temporary: remove together with Black when Ruff replaces it.
# Black infers its target from `requires-python` (py314 only), which switches it
# to 3.14-only syntax (unparenthesized `except A, B:`, parenthesized `with`) and
# breaks the Black GitHub Action, which runs on the runner's Python 3.12.
# Listing every version reproduces Black's per-file auto-detection, i.e. the
# formatting it produced before pyproject.toml existed.
[tool.black]
target-version = [
    "py33", "py34", "py35", "py36", "py37", "py38", "py39",
    "py310", "py311", "py312", "py313", "py314",
]
