# Python project metadata and dependency declarations, managed by uv.
# The app runs from src/smplfrm and is not built or installed as a package.
# https://docs.astral.sh/uv/concepts/projects/config/
[project]
name = "smplfrm"
# Placeholder required by PEP 621. The released version comes from git tags
# (scripts/generate_version.sh), not from this field.
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "opencv-python~=5.0.0.93",
    "pillow~=12.3.0",
    "python-dateutil~=2.9.0",
    "Django~=6.0.7",
    "djangorestframework~=3.18.1",
    "djangorestframework-jsonapi==8.1.0",
    "celery~=5.6.3",
    "django-celery-beat~=2.9.0",
    "redis~=8.1.0",
    "open-meteo~=0.4.0",
    "django-redis~=7.0.0",
    "spotipy~=2.26.0",
    "whitenoise~=6.12.0",
    "gunicorn~=26.2.0",
]

# Development-only tools; excluded from the Docker image (`uv sync --no-dev`).
[dependency-groups]
dev = [
    "pytest-django~=4.14.0",
    "pre-commit~=4.6.2",
    "ruff~=0.16.10",
]

[tool.uv]
package = false
# Minimum uv version, deliberately lower than the exact pins in
# .github/workflows/ci.yml (setup-uv `version`) and docker/images/Dockerfile.
# Dependabot runs its own bundled uv, which lags upstream releases; a floor above
# that version makes every Dependabot update fail with `tool_version_not_supported`.
# Raise this only when a newer uv feature is required, and only once Dependabot's
# bundled uv supports it.
required-version = ">=0.12.18"

# Ruff formatter and linter (https://docs.astral.sh/ruff/configuration/).
# target-version is inferred from `requires-python` (3.14).
[tool.ruff]
line-length = 88
# Ruff also formats Python code blocks in Markdown. Kiro specs and reviews are
# local, untracked working documents and are not held to the formatter.
extend-exclude = [".kiro"]

[tool.ruff.lint]
# Pinned to the classic default rule set (pycodestyle E4/E7/E9 + Pyflakes).
# Ruff 0.16 expanded its built-in default to several hundred rules; this keeps
# lint scope to correctness errors only. https://docs.astral.sh/ruff/rules/
select = ["E4", "E7", "E9", "F"]
